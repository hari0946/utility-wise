databases:
  - name: utility-wise-db
    databaseName: utility_wise
    user: utility_wise
    plan: free

services:
  - type: web
    name: utility-wise-api
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: DATABASE_URL
        fromDatabase:
          name: utility-wise-db
          property: connectionString
      - key: ADMIN_API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: RATE_LIMIT_SECONDS
        value: "30"
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_NOTIFY_TO
        value: "hariharan.b@batpl.com"
      - key: GMAIL_NOTIFY_NAME
        value: "Hariharan"

  - type: web
    name: utility-wise-frontend
    env: static
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: .
